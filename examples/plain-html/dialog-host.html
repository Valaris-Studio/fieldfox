<!doctype html>
<!--
  fieldfox embed INSIDE a host dialog (pilot-finding 5). Backplane and other apps
  open their forms in a Radix/native <dialog> that closes itself on a
  document-level Escape. This fixture reproduces that: a native <dialog open>
  wrapping the form, plus a document-level Escape listener standing in for the
  host's "close dialog on Esc" — it records whether an un-intercepted Escape
  reached the host. With the fieldfox panel open, its capture-phase Escape owner
  must close ONLY the panel, so the host never sees the key and the dialog stays
  open.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trailhead Makers — signup (host dialog)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 32rem; padding: 0 1rem; }
      dialog#host-dialog { width: min(30rem, 92vw); border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
      form { display: grid; gap: 0.5rem; }
      label { font-weight: 600; margin-top: 0.5rem; }
      input, select, textarea { font: inherit; padding: 0.4rem; }
      button { margin-top: 1rem; padding: 0.5rem; font: inherit; }
    </style>
  </head>
  <body>
    <h1>Trailhead Makers workshop signup</h1>

    <!-- The host's modal. `open` renders it immediately for the test. -->
    <dialog id="host-dialog" open>
      <form id="signup-form" method="get">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" type="text" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="notes">Anything we should know?</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <button type="submit">Sign up</button>
      </form>
    </dialog>

    <script>
      // Stand-in for the host framework's document-level "Esc closes my dialog"
      // handler (Radix registers exactly this). If an un-intercepted Escape
      // reaches the document, record it AND close the dialog — the behavior the
      // fieldfox panel must prevent while it is open.
      window.__hostEscapeSeen = false;
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.__hostEscapeSeen = true;
          document.getElementById('host-dialog').removeAttribute('open');
        }
      });
    </script>

    <script src="../../packages/widget/dist/fieldfox.js"></script>
    <field-fox
      target="#signup-form"
      endpoint="http://localhost:8787/api/fill"
      site-key="ffx_pk_dev0000000000000000000000000000"
    ></field-fox>
  </body>
</html>
