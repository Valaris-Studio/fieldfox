<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1360" width="840" height="1360" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">From source to your form.</title><desc id="desc">Six stages: source, widget schema, server and provider, server plan validation, widget write and readback, human review. Source leaves the browser. Readback is not factual proof. FieldFox never submits.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker></defs>
<style>
:root{--paper:#f5f2e9;--ink:#202722;--fox:#e2622c;--route:#2563eb;--sage:#e4e9df;--line:#c9cec4;--white:#fffdf7;--muted:#535d53}
.paper{fill:var(--paper)}.panel{fill:var(--white);stroke:var(--line);stroke-width:1.5}.sage{fill:var(--sage)}.ink{fill:var(--ink)}.orange{fill:var(--fox)}.blue{fill:var(--route)}.rule{fill:none;stroke:var(--line);stroke-width:1.5}.route{fill:none;stroke:var(--route);stroke-width:2.5}.dashed{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}.soft{fill:var(--sage);stroke:var(--line);stroke-width:1.5}.outline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.title{font-size:44px;font-weight:700;letter-spacing:-1.7px}.subtitle{font-size:23px;fill:var(--muted)}.heading{font-size:28px;font-weight:700;letter-spacing:-.6px}.body{font-size:21px}.small{font-size:17px;fill:var(--muted)}.mono{font-family:Menlo,Consolas,monospace;font-size:16px;fill:var(--muted)}.eyebrow{font-family:Menlo,Consolas,monospace;font-size:15px;letter-spacing:1.7px}.number{font-family:Menlo,Consolas,monospace;font-size:19px;font-weight:700}.white{fill:var(--white)}
</style>
<rect x="0" y="0" width="840" height="1360" rx="0" class="paper"/>
<text x="48" y="49" class="eyebrow">FIELDFOX / TINY FIELD LABORATORY</text>
<path d="M48 72 L792 72" class="rule" />
<text x="48" y="128" class="title">From source to your form.</text>
<text x="48" y="171" class="subtitle">A little less retyping. A clear path to review.</text><rect x="48" y="210" width="744" height="144" rx="20" class="panel"/><rect x="68" y="234" width="66" height="66" rx="20" class="orange"/><text x="101" y="275" class="number" text-anchor="middle">01</text><text x="158" y="249" class="heading">Bring the source.</text><text x="158" y="282" class="body">A message, image or enabled document.</text><text x="158" y="310" class="body">Start with information the source actually states.</text><text x="158" y="337" class="mono">SOURCE / text · image · document</text><path d="M101 356 L101 372" class="route" marker-end="url(#arrow)"/><rect x="48" y="374" width="744" height="144" rx="20" class="panel"/><rect x="68" y="398" width="66" height="66" rx="20" class="soft"/><text x="101" y="439" class="number" text-anchor="middle">02</text><text x="158" y="413" class="heading">Read the form.</text><text x="158" y="446" class="body">The widget maps supported controls and hints.</text><text x="158" y="474" class="body">Ignored fields stay outside its map.</text><text x="158" y="501" class="mono">WIDGET / schema + included field context</text><path d="M101 520 L101 536" class="route" marker-end="url(#arrow)"/><rect x="48" y="538" width="744" height="144" rx="20" class="panel"/><rect x="68" y="562" width="66" height="66" rx="20" class="soft"/><text x="101" y="603" class="number" text-anchor="middle">03</text><text x="158" y="577" class="heading">Ask for a proposal.</text><text x="158" y="610" class="body">The source and schema leave the browser.</text><text x="158" y="638" class="body">Your server asks a compatible model provider.</text><text x="158" y="665" class="mono">BROWSER → SERVER → PROVIDER</text><path d="M101 684 L101 700" class="route" marker-end="url(#arrow)"/><rect x="48" y="702" width="744" height="144" rx="20" class="panel"/><rect x="68" y="726" width="66" height="66" rx="20" class="soft"/><text x="101" y="767" class="number" text-anchor="middle">04</text><text x="158" y="741" class="heading">Validate the plan.</text><text x="158" y="774" class="body">The provider proposes a structured fill plan.</text><text x="158" y="802" class="body">The server validates it before returning it.</text><text x="158" y="829" class="mono">PROVIDER → SERVER → WIDGET</text><path d="M101 848 L101 864" class="route" marker-end="url(#arrow)"/><rect x="48" y="866" width="744" height="144" rx="20" class="panel"/><rect x="68" y="890" width="66" height="66" rx="20" class="soft"/><text x="101" y="931" class="number" text-anchor="middle">05</text><text x="158" y="905" class="heading">Apply. Then read back.</text><text x="158" y="938" class="body">Supported values are written, then checked.</text><text x="158" y="966" class="body">A write check does not prove a fact is correct.</text><text x="158" y="993" class="mono">WIDGET / apply → readback</text><path d="M101 1012 L101 1028" class="route" marker-end="url(#arrow)"/><rect x="48" y="1030" width="744" height="144" rx="20" class="panel"/><rect x="68" y="1054" width="66" height="66" rx="20" class="soft"/><text x="101" y="1095" class="number" text-anchor="middle">06</text><text x="158" y="1069" class="heading">You review the result.</text><text x="158" y="1102" class="body">Compare with the source. Edit what needs it.</text><text x="158" y="1130" class="body">Your app owns the next action.</text><text x="158" y="1157" class="mono">HUMAN / FieldFox never submits the form</text><text x="48" y="1237" class="heading">Readback checks the write. You check the meaning.</text><text x="48" y="1272" class="small">Documents depend on model capability. This is a conceptual diagram.</text><text x="48" y="1299" class="small">Public source: README.md → How it works · Inputs · Data and trust</text>
<text x="48" y="1332" class="eyebrow">ILLUSTRATED SYSTEM MAP · 18 SEP 2026 · FIELDFOX IS PRE-LAUNCH</text>
<g transform="translate(720 223)" aria-hidden="true"><path d="M10 4H34L44 14V49H10Z" class="soft"/><path d="M34 4V14H44M18 24H35M18 31H35M18 38H29" class="outline"/><rect x="1" y="29" width="12" height="12" rx="3" class="orange"/></g><g transform="translate(720 387)" aria-hidden="true"><rect x="6" y="4" width="43" height="47" rx="7" class="soft"/><path d="M7 15H48" class="outline"/><circle cx="13" cy="10" r="2" class="orange"/><rect x="14" y="22" width="28" height="7" rx="2" class="route"/><rect x="14" y="36" width="28" height="7" rx="2" class="route"/></g><g transform="translate(720 551)" aria-hidden="true"><rect x="5" y="7" width="45" height="17" rx="5" class="soft"/><rect x="5" y="31" width="45" height="17" rx="5" class="soft"/><circle cx="14" cy="15.5" r="3" class="orange"/><circle cx="14" cy="39.5" r="3" class="blue"/><path d="M27 15H40M27 39H40M27 24V31" class="outline"/></g><g transform="translate(720 715)" aria-hidden="true"><path d="M10 4H34L44 14V49H10Z" class="soft"/><path d="M34 4V14H44M18 24L20 22M18 24L20 26M35 24L33 22M35 24L33 26M25 21L28 27M17 37L23 42L36 31" class="outline"/></g><g transform="translate(720 879)" aria-hidden="true"><rect x="9" y="18" width="37" height="19" rx="5" class="soft"/><path d="M17 27H37M7 13C18 -1 43 4 48 19M43 16L48 19L50 13M47 42C32 56 11 48 6 35M3 41L6 35L12 39" class="route"/></g><g transform="translate(720 1043)" aria-hidden="true"><circle cx="15" cy="17" r="9" class="soft"/><path d="M1 43C1 27 29 27 29 43" class="outline"/><rect x="34" y="9" width="18" height="35" rx="4" class="soft"/><path d="M39 18H47M39 25H47M39 32H44" class="outline"/></g>
</svg>
