<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1340" width="840" height="1340" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Know where the bits go.</title><desc id="desc">Three explicit trust boundaries: browser with a public site key; configured server with provider credentials, guardrails and validation; compatible model provider receiving source data. Self-hosting with a remote provider is not browser-local processing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker></defs>
<style>
:root{--paper:#f5f2e9;--ink:#202722;--fox:#e2622c;--route:#2563eb;--sage:#e4e9df;--line:#c9cec4;--white:#fffdf7;--muted:#535d53}
.paper{fill:var(--paper)}.panel{fill:var(--white);stroke:var(--line);stroke-width:1.5}.sage{fill:var(--sage)}.ink{fill:var(--ink)}.orange{fill:var(--fox)}.blue{fill:var(--route)}.rule{fill:none;stroke:var(--line);stroke-width:1.5}.route{fill:none;stroke:var(--route);stroke-width:2.5}.dashed{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}.soft{fill:var(--sage);stroke:var(--line);stroke-width:1.5}.outline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.title{font-size:44px;font-weight:700;letter-spacing:-1.7px}.subtitle{font-size:23px;fill:var(--muted)}.heading{font-size:28px;font-weight:700;letter-spacing:-.6px}.body{font-size:21px}.small{font-size:17px;fill:var(--muted)}.mono{font-family:Menlo,Consolas,monospace;font-size:16px;fill:var(--muted)}.eyebrow{font-family:Menlo,Consolas,monospace;font-size:15px;letter-spacing:1.7px}.number{font-family:Menlo,Consolas,monospace;font-size:19px;font-weight:700}.white{fill:var(--white)}
</style>
<rect x="0" y="0" width="840" height="1340" rx="0" class="paper"/>
<text x="48" y="49" class="eyebrow">FIELDFOX / TINY FIELD LABORATORY</text>
<path d="M48 72 L792 72" class="rule" />
<text x="48" y="128" class="title">Know where the bits go.</text>
<text x="48" y="171" class="subtitle">Follow the data. Give every key the right job.</text><rect x="48" y="208" width="744" height="68" rx="18" class="sage"/><text x="70" y="237" class="eyebrow">SOURCE CONTENT IS DATA, NOT INSTRUCTIONS</text><text x="70" y="262" class="small">A prompt boundary is a guardrail, not an immunity claim.</text><rect x="48" y="312" width="744" height="178" rx="20" class="panel"/><text x="70" y="343" class="eyebrow">01 / BROWSER</text><text x="70" y="384" class="heading">Your form + the FieldFox widget</text><text x="70" y="422" class="body">Builds a schema; collects your supplied source.</text><text x="70" y="457" class="small">Site key: public identifier. Ignored fields excluded.</text><path d="M108 493 L108 554" class="route" marker-end="url(#arrow)"/><text x="136" y="521" class="mono">SOURCE + SCHEMA + INCLUDED FIELD CONTEXT</text><text x="136" y="546" class="small">This request leaves the browser.</text><rect x="48" y="570" width="744" height="207" rx="20" class="panel"/><text x="70" y="601" class="eyebrow">02 / CONFIGURED SERVER</text><text x="70" y="642" class="heading">Guardrails + plan validation</text><text x="70" y="680" class="body">Separates site-author guidance from source content.</text><text x="70" y="713" class="body">Applies configured limits; validates the returned plan.</text><rect x="70" y="735" width="378" height="27" rx="7" class="sage"/><text x="83" y="754" class="mono">Provider API key: server-side secret</text><path d="M108 780 L108 841" class="route" marker-end="url(#arrow)"/><text x="136" y="808" class="mono">MODEL REQUEST / SOURCE GOES TO PROVIDER</text><text x="136" y="833" class="small">Provider capabilities and handling matter.</text><rect x="48" y="858" width="744" height="170" rx="20" class="panel"/><text x="70" y="889" class="eyebrow">03 / COMPATIBLE MODEL PROVIDER</text><text x="70" y="931" class="heading">Proposes values for the form</text><text x="70" y="968" class="body">Returns a proposed plan to the server.</text><text x="70" y="1003" class="small">The server returns a validated plan to the widget.</text><rect x="48" y="1060" width="744" height="139" rx="20" class="sage"/><text x="70" y="1099" class="heading">Self-hosting ≠ browser-local processing.</text><text x="70" y="1136" class="body">A remote provider still receives the supplied data.</text><text x="70" y="1171" class="small">Origin checks constrain use; Origin alone is not authentication.</text><text x="48" y="1244" class="small">Conceptual boundaries, not a security certification.</text><text x="48" y="1272" class="small">Public source: README.md → Data and trust · How it works</text>
<text x="48" y="1312" class="eyebrow">ILLUSTRATED SYSTEM MAP · 18 SEP 2026 · FIELDFOX IS PRE-LAUNCH</text>
<g transform="translate(708 335)" aria-hidden="true"><rect x="6" y="4" width="43" height="47" rx="7" class="soft"/><path d="M7 15H48" class="outline"/><circle cx="13" cy="10" r="2" class="orange"/><rect x="14" y="22" width="28" height="7" rx="2" class="route"/><rect x="14" y="36" width="28" height="7" rx="2" class="route"/></g><g transform="translate(708 595)" aria-hidden="true"><rect x="5" y="7" width="45" height="17" rx="5" class="soft"/><rect x="5" y="31" width="45" height="17" rx="5" class="soft"/><circle cx="14" cy="15.5" r="3" class="orange"/><circle cx="14" cy="39.5" r="3" class="blue"/><path d="M27 15H40M27 39H40M27 24V31" class="outline"/></g><g transform="translate(708 882)" aria-hidden="true"><circle cx="27" cy="27" r="18" class="soft"/><path d="M27 9V2M27 45V52M9 27H2M45 27H52M14 14L9 9M40 40L45 45M14 40L9 45M40 14L45 9" class="route"/><circle cx="27" cy="27" r="6" class="orange"/></g>
</svg>
