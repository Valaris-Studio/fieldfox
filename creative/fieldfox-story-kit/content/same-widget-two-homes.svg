<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1260" width="840" height="1260" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">One fox. Two homes.</title><desc id="desc">An identical MIT FieldFox widget can connect to planned pre-launch Cloud or a self-hosted server available for evaluation. Cloud intends a free first fill before signup. Provider and infrastructure costs apply for self-hosting. Both retain human review and never auto-submit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker></defs>
<style>
:root{--paper:#f5f2e9;--ink:#202722;--fox:#e2622c;--route:#2563eb;--sage:#e4e9df;--line:#c9cec4;--white:#fffdf7;--muted:#535d53}
.paper{fill:var(--paper)}.panel{fill:var(--white);stroke:var(--line);stroke-width:1.5}.sage{fill:var(--sage)}.ink{fill:var(--ink)}.orange{fill:var(--fox)}.blue{fill:var(--route)}.rule{fill:none;stroke:var(--line);stroke-width:1.5}.route{fill:none;stroke:var(--route);stroke-width:2.5}.dashed{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}.soft{fill:var(--sage);stroke:var(--line);stroke-width:1.5}.outline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.title{font-size:44px;font-weight:700;letter-spacing:-1.7px}.subtitle{font-size:23px;fill:var(--muted)}.heading{font-size:28px;font-weight:700;letter-spacing:-.6px}.body{font-size:21px}.small{font-size:17px;fill:var(--muted)}.mono{font-family:Menlo,Consolas,monospace;font-size:16px;fill:var(--muted)}.eyebrow{font-family:Menlo,Consolas,monospace;font-size:15px;letter-spacing:1.7px}.number{font-family:Menlo,Consolas,monospace;font-size:19px;font-weight:700}.white{fill:var(--white)}
</style>
<rect x="0" y="0" width="840" height="1260" rx="0" class="paper"/>
<text x="48" y="49" class="eyebrow">FIELDFOX / TINY FIELD LABORATORY</text>
<path d="M48 72 L792 72" class="rule" />
<text x="48" y="128" class="title">One fox. Two homes.</text>
<text x="48" y="171" class="subtitle">Same widget. Your choice of who runs the server.</text><rect x="48" y="207" width="744" height="153" rx="20" class="ink"/><text x="76" y="240" class="eyebrow white">THE SAME MIT WIDGET</text><text x="76" y="285" class="heading white">Source → field-fox → your existing form</text><text x="76" y="326" class="body white">Same fill engine. Supported writes. Human review.</text><path d="M420 362 L420 403" class="route" /><path d="M420 403 L108 403" class="route" /><path d="M108 403 L108 431" class="route" marker-end="url(#arrow)"/><rect x="48" y="448" width="744" height="254" rx="20" class="panel"/><text x="70" y="482" class="eyebrow">A / FIELDFOX CLOUD</text><text x="70" y="525" class="heading">The planned easy starting point.</text><rect x="70" y="543" width="127" height="29" rx="7" class="sage"/><text x="83" y="563" class="mono">PRE-LAUNCH</text><text x="70" y="606" class="body">Intended: a free first fill before signup.</text><text x="70" y="641" class="small">The public zero-config snippet is not ready for adoption.</text><text x="70" y="677" class="mono">Widget → Cloud server → configured provider</text><path d="M420 704 L420 726" class="rule" /><text x="420" y="757" class="eyebrow" text-anchor="middle">OR, RUN IT YOURSELF</text><path d="M420 772 L420 794" class="rule" /><rect x="48" y="810" width="744" height="253" rx="20" class="panel"/><text x="70" y="844" class="eyebrow">B / SELF-HOSTED</text><text x="70" y="887" class="heading">Your server. Your compatible provider.</text><rect x="70" y="906" width="238" height="29" rx="7" class="sage"/><text x="83" y="926" class="mono">AVAILABLE FOR EVALUATION</text><text x="70" y="969" class="body">Run the MIT widget and server on your terms.</text><text x="70" y="1005" class="small">Provider and infrastructure costs still apply.</text><text x="70" y="1040" class="mono">Widget → your server → configured provider</text><text x="48" y="1119" class="heading">You still review. FieldFox still never submits.</text><text x="48" y="1154" class="small">Self-hosting with a remote provider still sends data to that provider.</text><text x="48" y="1190" class="small">Public source: README.md → Availability · Self-hosting · Data and trust</text>
<text x="48" y="1232" class="eyebrow">ILLUSTRATED SYSTEM MAP · 18 SEP 2026 · FIELDFOX IS PRE-LAUNCH</text>
<g transform="translate(707 250)" aria-hidden="true"><path d="M7 8L22 17L33 17L48 8L45 35L27 48L10 35Z" class="orange"/><path d="M11 27L27 38L44 27L39 39L27 48L15 39Z" class="white"/><circle cx="19" cy="27" r="2" class="ink"/><circle cx="36" cy="27" r="2" class="ink"/><path d="M23 37H31L27 41Z" class="ink"/></g><g transform="translate(708 481)" aria-hidden="true"><path d="M12 41C-2 41-2 22 12 21C15 2 40 2 44 23C59 25 55 41 44 41Z" class="soft"/><path d="M18 29H36M27 20V38" class="route"/></g><g transform="translate(708 839)" aria-hidden="true"><rect x="5" y="7" width="45" height="17" rx="5" class="soft"/><rect x="5" y="31" width="45" height="17" rx="5" class="soft"/><circle cx="14" cy="15.5" r="3" class="orange"/><circle cx="14" cy="39.5" r="3" class="blue"/><path d="M27 15H40M27 39H40M27 24V31" class="outline"/></g>
</svg>
